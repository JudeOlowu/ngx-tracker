[package]
name = "ngx_screener"
version = "0.1.0"
edition = "2021"

# 🇳🇬 NGX Radar - Nigerian Stock Exchange Screener

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
scraper = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
colored = "2.1"
comfy-table = "6"
dotenv = "0.15"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.4", features = ["derive"] }
tokio-retry = "0.3"

# Railway / Render server mode dependencies
axum = "0.7"
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "set-header", "fs", "trace"] }
