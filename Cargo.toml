[package]\nname = \"ngx_screener\"\nversion = \"0.1.0\"\nedition = \"2021\"\n\n# 🇳🇬 NGX Radar - Nigerian Stock Exchange Screener\n\n[dependencies]\ntokio = { version = \"1.35\", features = [\"full\"] }\nreqwest = { version = \"0.11\", features = [\"json\"] }\nscraper = \"0.19\"\nserde = { version = \"1.0\", features = [\"derive\"] }\nserde_json = \"1.0\"\nchrono = { version = \"0.4\", features = [\"serde\"] }\ncsv = \"1.3\"\ncolored = \"2.1\"\ncomfy-table = \"6\"\ndotenv = \"0.15\"\nanyhow = \"1.0\"\nthiserror = \"1.0\"\ntracing = \"0.1\"\ntracing-subscriber = { version = \"0.3\", features = [\"env-filter\"] }\nclap = { version = \"4.4\", features = [\"derive\"] }\ntokio-retry = \"0.3\"\n\n# Railway / Render server mode dependencies\naxum = \"0.7\"\ntower = { version = \"0.4\", features = [\"full\"] }\ntower-http = { version = \"0.5\", features = [\"cors\", \"set-header\", \"fs\", \"trace\"] }\n